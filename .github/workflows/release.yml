
name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create release pull request
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          target-branch: main
          
